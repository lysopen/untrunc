name: Windows zh-CN GUI build

on:
  push:
    branches: [master, feat/zh-cn-windows-gui]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      FF_VER: "3.3.4"
      LIBUI_VER: "alpha4.1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - job: "64"
            untr_dest: untrunc_zh-CN_x64
            msystem: MINGW64
            arch: win64
            arch_ui: amd64
            sha_ffmpeg_dev: 9226dfe7f386d339f529bc2ba1be1022a44c829aeeadd2d905593d176c696feb
            sha_ffmpeg_shared: 4b2890ecf26130d2f11e5d9e25ccd008cbe8cbff633504729de24bf50f1e2c57
            sha_libui: f0d262959fd96ea5caeef188b56680f7f638e7b3d8a68575ff58e4000ae75109

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4

      - name: Set up MSYS2 / MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          # Refresh package metadata and avoid restoring stale package downloads.
          update: true
          cache: false
          # Use MSYS make for both architectures; MinGW32 no longer packages make.
          install: git zip unzip curl make
          # pacboy: ':p' auto-prefixes with the active MSYSTEM (mingw-w64-i686-* / -x86_64-*)
          # ntldd: arch-aware PE dependency lister (ldd mis-resolves 32-bit exes)
          pacboy: gcc:p ntldd:p

      - name: Download external artifacts
        run: |
          ff_base="https://web.archive.org/https://ffmpeg.zeranoe.com/builds"
          libui_base="https://github.com/andlabs/libui/releases/download/${LIBUI_VER}"

          curl -fsSL "${ff_base}/${{ matrix.arch }}/dev/ffmpeg-${FF_VER}-${{ matrix.arch }}-dev.zip"       -o ffmpeg-dev.zip
          curl -fsSL "${ff_base}/${{ matrix.arch }}/shared/ffmpeg-${FF_VER}-${{ matrix.arch }}-shared.zip" -o ffmpeg-shared.zip
          curl -fsSL "${libui_base}/libui-${LIBUI_VER}-windows-${{ matrix.arch_ui }}-mingw-static.zip"     -o libui-static.zip

      - name: Verify checksums (fail-fast)
        run: |
          cat > SHA256SUMS <<EOF
          ${{ matrix.sha_ffmpeg_dev }}  ffmpeg-dev.zip
          ${{ matrix.sha_ffmpeg_shared }}  ffmpeg-shared.zip
          ${{ matrix.sha_libui }}  libui-static.zip
          EOF
          sha256sum -c SHA256SUMS

      - name: Unpack into the MinGW sysroot
        run: |
          sysroot="$MINGW_PREFIX"   # /mingw64 or /mingw32, exported by MSYS2

          unzip -q ffmpeg-dev.zip
          cp -r ffmpeg-${FF_VER}-${{ matrix.arch }}-dev/include/* "${sysroot}/include/"
          cp -r ffmpeg-${FF_VER}-${{ matrix.arch }}-dev/lib/*     "${sysroot}/lib/"

          unzip -q ffmpeg-shared.zip
          cp -r ffmpeg-${FF_VER}-${{ matrix.arch }}-shared/bin/*  "${sysroot}/bin/"

          unzip -q -d libui-static libui-static.zip
          find libui-static -name '*.h' -exec cp {} "${sysroot}/include/" \;
          find libui-static -name '*.a' -exec cp {} "${sysroot}/lib/" \;

      - name: Verify Chinese GUI strings
        run: |
          grep -q '视频修复' src/gui/gui.cpp
          grep -q '参考视频' src/gui/gui.cpp
          grep -q '损坏视频' src/gui/gui.cpp
      - name: Build
        run: |
          make IS_RELEASE=1
          make untrunc-gui LIBUI_STATIC=1 IS_RELEASE=1

      - name: Bundle DLLs, strip and zip
        run: |
          dest="${{ matrix.untr_dest }}"
          mkdir -p "$dest"

          ntldd -R untrunc-gui.exe | awk '{print $1}' | sort -u | while read -r name; do
            src="$MINGW_PREFIX/bin/$name"
            [ -f "$src" ] || continue
            cp -v "$src" "$dest/$(basename "$name" | tr '[:lower:]' '[:upper:]')"
          done

          strip untrunc.exe     -o "$dest/untrunc.exe"
          strip untrunc-gui.exe -o "$dest/untrunc-gui.exe"
          cp COPYING "$dest/COPYING"
          cp README.zh-CN.md "$dest/README.zh-CN.md"
          zip -r "${dest}.zip" "$dest"

      - name: Locate Inno Setup compiler
        shell: pwsh
        run: |
          $candidate = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $candidate)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup install failed" }
          }
          if (-not (Test-Path $candidate)) { throw "Inno Setup compiler not found" }
          "ISCC_PATH=$candidate" >> $env:GITHUB_ENV

      - name: Build x64 Setup installer
        shell: pwsh
        run: |
          & $env:ISCC_PATH "/DAppVersion=2026.11.02.2" "installer\Windows-ZhCN-Setup.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compile failed" }
          if (-not (Test-Path "dist\Untrunc-zhCN-x64-Setup-v2026.11.02.2.exe")) {
            throw "Installer output missing"
          }

      - name: Verify installer silent installation and uninstallation
        shell: pwsh
        run: |
          $setup = (Resolve-Path "dist\Untrunc-zhCN-x64-Setup-v2026.11.02.2.exe").Path
          $target = Join-Path $env:RUNNER_TEMP "Untrunc-ZhCN-Install-Smoke"
          & $setup /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- "/DIR=$target"
          if ($LASTEXITCODE -ne 0) { throw "Silent installation failed: $LASTEXITCODE" }
          foreach ($name in @("untrunc-gui.exe", "untrunc.exe", "COPYING", "README.zh-CN.md")) {
            if (-not (Test-Path (Join-Path $target $name))) { throw "Missing installed file: $name" }
          }
          $uninstaller = Join-Path $target "unins000.exe"
          if (-not (Test-Path $uninstaller)) { throw "Uninstaller not found" }
          $p = Start-Process -FilePath $uninstaller -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Uninstall failed: $($p.ExitCode)" }
          if (Test-Path (Join-Path $target "untrunc-gui.exe")) {
            throw "Uninstall left executable behind"
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Untrunc-zhCN-x64-Setup
          path: dist/Untrunc-zhCN-x64-Setup-v2026.11.02.2.exe
          if-no-files-found: error

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.untr_dest }}
          path: ${{ matrix.untr_dest }}.zip
